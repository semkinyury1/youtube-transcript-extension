<!-- Markup based on obsidianmd/obsidian-clipper#946. Subtitle text is test data. -->
<ytd-engagement-panel-section-list-renderer target-id="engagement-panel-searchable-transcript"
  visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"></ytd-engagement-panel-section-list-renderer>
<ytd-engagement-panel-section-list-renderer visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED">
  <transcript-segment-list-view-model>
    <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
      <div aria-hidden="true" class="ytwTranscriptSegmentViewModelTimestamp">0:01</div>
      <div class="ytwTranscriptSegmentViewModelTimestampA11yLabel">1 second</div>
      <span class="ytAttributedStringHost ytAttributedStringLinkInheritColor" role="text">Первая строка новой расшифровки.</span>
    </transcript-segment-view-model>
    <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
      <div aria-hidden="true" class="ytwTranscriptSegmentViewModelTimestamp">0:12</div>
      <div class="ytwTranscriptSegmentViewModelTimestampA11yLabel">12 seconds</div>
      <span class="ytAttributedStringHost" role="text">Следующая строка.</span>
    </transcript-segment-view-model>
  </transcript-segment-list-view-model>
</ytd-engagement-panel-section-list-renderer>
